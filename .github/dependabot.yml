version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      oxc:
        patterns: ["oxlint", "oxfmt", "oxc-*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
